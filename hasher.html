<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bcrypt Password Hasher</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .box {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        input,
        textarea,
        button {
            width: 100%;
            font-size: 16px;
        }

        input {
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 110px;
            padding: 12px;
            margin-top: 10px;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 13px;
            margin-top: 10px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Bcrypt Password Hasher</h2>

    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button id="hashBtn">
        Generate Hash
    </button>

    <textarea
        id="hash"
        readonly
        placeholder="Generated hash will appear here..."
    ></textarea>

    <button id="copyBtn">
        Copy Hash
    </button>

    <p id="message"></p>

</div>

<script>
    const passwordInput = document.getElementById("password");
    const hashOutput = document.getElementById("hash");
    const message = document.getElementById("message");

    document.getElementById("hashBtn").addEventListener("click", function () {

        const password = passwordInput.value.trim();

        if (!password) {
            message.textContent = "Please enter a password.";
            return;
        }

        // Check if bcrypt loaded
        if (typeof bcrypt === "undefined") {
            message.textContent =
                "Bcrypt failed to load. Check your internet connection and refresh.";
            return;
        }

        try {
            // Generate salt
            const salt = bcrypt.genSaltSync(12);

            // Generate bcrypt hash
            const hash = bcrypt.hashSync(password, salt);

            hashOutput.value = hash;

            message.textContent = "Hash generated successfully.";

        } catch (error) {
            console.error(error);
            message.textContent = "An error occurred while generating the hash.";
        }
    });

    document.getElementById("copyBtn").addEventListener("click", async function () {

        if (!hashOutput.value) {
            message.textContent = "Generate a hash first.";
            return;
        }

        try {
            await navigator.clipboard.writeText(hashOutput.value);
            message.textContent = "Hash copied to clipboard.";
        } catch (error) {
            hashOutput.select();
            document.execCommand("copy");
            message.textContent = "Hash copied.";
        }
    });
</script>

</body>
</html>
